<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>외출 준비물 체크</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 체크박스 커스텀 애니메이션 효과 */
    .checkbox-bounce {
      transition: transform 0.15s ease-in-out;
    }
    .checkbox-bounce:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-sky-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-xl border border-white/60 p-6 sm:p-8 flex flex-col gap-6 transition-all">
    
    <!-- 헤더 섹션 -->
    <header class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl text-3xl shadow-inner mb-1">
        🎒
      </div>
      <h1 class="text-2xl font-bold text-gray-800 tracking-tight">외출 준비물 체크</h1>
      <p class="text-sm text-gray-500">잊은 물건이 없는지 꼼꼼하게 확인해 보세요!</p>
    </header>

    <!-- 진행 상황 프로그레스 바 -->
    <section class="bg-slate-50 border border-slate-100 p-4 rounded-2xl space-y-2">
      <div class="flex justify-between items-center text-xs font-semibold text-gray-600">
        <span>챙긴 물건</span>
        <span id="progress-text" class="text-indigo-600 font-bold">0 / 4 완료 (0%)</span>
      </div>
      <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-indigo-500 h-full rounded-full transition-all duration-300 ease-out" style="width: 0%;"></div>
      </div>
    </section>

    <!-- 체크리스트 목록 섹션 -->
    <section class="space-y-3" aria-label="준비물 체크리스트">
      
      <!-- 휴대전화 -->
      <label class="item-card flex items-center justify-between p-4 rounded-2xl border-2 border-gray-100 hover:border-indigo-200 bg-white shadow-sm cursor-pointer transition-all duration-200 select-none group">
        <div class="flex items-center gap-3.5">
          <span class="text-2xl group-hover:scale-110 transition-transform">📱</span>
          <span class="text-base font-medium text-gray-800 item-name">휴대전화</span>
        </div>
        <input type="checkbox" value="휴대전화" class="item-checkbox checkbox-bounce w-6 h-6 text-indigo-600 rounded-lg border-gray-300 focus:ring-indigo-400 focus:ring-2 cursor-pointer transition-all">
      </label>

      <!-- 지갑 -->
      <label class="item-card flex items-center justify-between p-4 rounded-2xl border-2 border-gray-100 hover:border-indigo-200 bg-white shadow-sm cursor-pointer transition-all duration-200 select-none group">
        <div class="flex items-center gap-3.5">
          <span class="text-2xl group-hover:scale-110 transition-transform">👛</span>
          <span class="text-base font-medium text-gray-800 item-name">지갑</span>
        </div>
        <input type="checkbox" value="지갑" class="item-checkbox checkbox-bounce w-6 h-6 text-indigo-600 rounded-lg border-gray-300 focus:ring-indigo-400 focus:ring-2 cursor-pointer transition-all">
      </label>

      <!-- 물병 -->
      <label class="item-card flex items-center justify-between p-4 rounded-2xl border-2 border-gray-100 hover:border-indigo-200 bg-white shadow-sm cursor-pointer transition-all duration-200 select-none group">
        <div class="flex items-center gap-3.5">
          <span class="text-2xl group-hover:scale-110 transition-transform">💧</span>
          <span class="text-base font-medium text-gray-800 item-name">물병</span>
        </div>
        <input type="checkbox" value="물병" class="item-checkbox checkbox-bounce w-6 h-6 text-indigo-600 rounded-lg border-gray-300 focus:ring-indigo-400 focus:ring-2 cursor-pointer transition-all">
      </label>

      <!-- 우산 -->
      <label class="item-card flex items-center justify-between p-4 rounded-2xl border-2 border-gray-100 hover:border-indigo-200 bg-white shadow-sm cursor-pointer transition-all duration-200 select-none group">
        <div class="flex items-center gap-3.5">
          <span class="text-2xl group-hover:scale-110 transition-transform">☂️</span>
          <span class="text-base font-medium text-gray-800 item-name">우산</span>
        </div>
        <input type="checkbox" value="우산" class="item-checkbox checkbox-bounce w-6 h-6 text-indigo-600 rounded-lg border-gray-300 focus:ring-indigo-400 focus:ring-2 cursor-pointer transition-all">
      </label>

    </section>

    <!-- 빠른 보조 버튼 (전체선택 / 초기화) -->
    <div class="flex justify-end gap-2 text-xs text-gray-500">
      <button type="button" id="btn-select-all" class="px-2.5 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium transition-colors">
        모두 선택
      </button>
      <button type="button" id="btn-reset-all" class="px-2.5 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium transition-colors">
        다시 체크하기
      </button>
    </div>

    <!-- 실행 버튼 -->
    <button type="button" id="btn-check" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all duration-200 flex items-center justify-center gap-2 text-base">
      <span>준비 확인</span>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </button>

    <!-- 결과 메시지 카드 (초기에는 숨김) -->
    <div id="result-box" class="hidden rounded-2xl p-4 transition-all duration-300 text-center" role="alert">
      <!-- 동적 텍스트 및 안내가 여기에 삽입됩니다 -->
    </div>

  </main>

  <script>
    const checkboxes = document.querySelectorAll('.item-checkbox');
    const cards = document.querySelectorAll('.item-card');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const btnCheck = document.getElementById('btn-check');
    const btnSelectAll = document.getElementById('btn-select-all');
    const btnResetAll = document.getElementById('btn-reset-all');
    const resultBox = document.getElementById('result-box');

    const totalCount = checkboxes.length;

    // 체크박스 상태에 따른 시각적 스타일 및 진행률 업데이트
    function updateProgress() {
      let checkedCount = 0;

      checkboxes.forEach((cb) => {
        const card = cb.closest('.item-card');
        const nameEl = card.querySelector('.item-name');

        if (cb.checked) {
          checkedCount++;
          card.classList.add('bg-indigo-50/70', 'border-indigo-300');
          card.classList.remove('border-gray-100');
          nameEl.classList.add('line-through', 'text-gray-400');
          nameEl.classList.remove('text-gray-800');
        } else {
          card.classList.remove('bg-indigo-50/70', 'border-indigo-300');
          card.classList.add('border-gray-100');
          nameEl.classList.remove('line-through', 'text-gray-400');
          nameEl.classList.add('text-gray-800');
        }
      });

      const percentage = Math.round((checkedCount / totalCount) * 100);
      progressBar.style.width = percentage + '%';
      progressText.textContent = `${checkedCount} / ${totalCount} 완료 (${percentage}%)`;

      // 색상 동적 전환
      if (percentage === 100) {
        progressBar.classList.remove('bg-indigo-500');
        progressBar.classList.add('bg-emerald-500');
      } else {
        progressBar.classList.add('bg-indigo-500');
        progressBar.classList.remove('bg-emerald-500');
      }
    }

    checkboxes.forEach((cb) => {
      cb.addEventListener('change', () => {
        updateProgress();
        // 체크박스 조작 시 기존 결과 안내 닫기
        resultBox.classList.add('hidden');
      });
    });

    // '준비 확인' 버튼 클릭 처리
    btnCheck.addEventListener('click', () => {
      const uncheckedItems = [];

      checkboxes.forEach((cb) => {
        if (!cb.checked) {
          uncheckedItems.push(cb.value);
        }
      });

      resultBox.classList.remove('hidden');

      if (uncheckedItems.length === 0) {
        // 모든 항목 체크 완료 시
        resultBox.className = 'rounded-2xl p-5 bg-emerald-50 border-2 border-emerald-300 text-emerald-800 text-center animate-fade-in transition-all';
        resultBox.innerHTML = `
          <div class="flex flex-col items-center gap-1.5">
            <span class="text-3xl">🎉</span>
            <strong class="text-lg font-bold text-emerald-900">준비 완료!</strong>
            <p class="text-sm text-emerald-700">모든 소지품을 챙기셨습니다. 즐겁고 안전한 외출 되세요!</p>
          </div>
        `;
      } else {
        // 아직 체크하지 않은 항목이 남아있을 때
        resultBox.className = 'rounded-2xl p-5 bg-amber-50 border-2 border-amber-300 text-amber-800 text-center transition-all';
        resultBox.innerHTML = `
          <div class="flex flex-col items-center gap-1.5">
            <span class="text-3xl">⚠️</span>
            <strong class="text-base font-bold text-amber-900">아직 챙기지 않은 물품이 있어요!</strong>
            <p class="text-sm text-amber-700">
              <span class="font-semibold text-amber-900 underline decoration-amber-400 underline-offset-4">${uncheckedItems.join(', ')}</span>을(를) 확인해 주세요.
            </p>
          </div>
        `;
      }
    });

    // 전체 선택
    btnSelectAll.addEventListener('click', () => {
      checkboxes.forEach((cb) => (cb.checked = true));
      updateProgress();
      resultBox.classList.add('hidden');
    });

    // 다시 체크하기 (초기화)
    btnResetAll.addEventListener('click', () => {
      checkboxes.forEach((cb) => (cb.checked = false));
      updateProgress();
      resultBox.classList.add('hidden');
    });

    // 초기 상태 반영
    updateProgress();
  </script>
</body>
</html>
